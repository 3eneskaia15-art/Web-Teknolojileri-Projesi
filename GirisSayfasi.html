<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Portfolyo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #0F172A; /* Ana koyu arka plan */
            color: #F8FAFC; /* Genel metin rengi (okunabilir kırık beyaz) */
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .highlight-text {
            color: #38BDF8; /* Başlık ve link vurgu rengi */
        }

        /* Hakkımda metni için özel kutu tasarımı */
        .intro-box {
            background-color: #1E293B;
            border-left: 5px solid #38BDF8; /* Sol tarafa şık bir çizgi çektik */
        }

        /* Menü linkleri için profesyonel buton görünümü */
        .custom-link {
            background-color: #1E293B;
            color: #38BDF8;
            text-decoration: none; /* Linklerin altındaki varsayılan çizgiyi kaldırdık */
        }

        /* Fare linkin üzerine geldiğinde (Hover durumu) */
        .custom-link:hover {
            background-color: #38BDF8;
            color: #0F172A;
    
        }
    </style>
</head>
<body>

    <main class="container py-5">
        
        <header class="text-center mb-10">
            <h1 class="highlight-text display-5 fw-bold">Siteme Hoşgeldiniz</h1>
        </header>

        <section class="intro-box p-4 mb-5 rounded shadow">
            <p class="lead mb-0">Ben Enes Kaya, Sakarya Üniversitesi'nde Bilgisayar Mühendisliği Öğrencisiyim.</p>
        </section>

        <nav>
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    
                    <ul class="list-unstyled d-flex flex-column gap-3">
                        <li><a href="Hakkımda.html" class="custom-link d-block p-3 rounded text-center fw-semibold shadow-sm">Hakkımda</a></li>
                        <li><a href="Özgeçmiş.html" class="custom-link d-block p-3 rounded text-center fw-semibold shadow-sm">Özgeçmiş</a></li>
                        <li><a href="Şehrim.html" class="custom-link d-block p-3 rounded text-center fw-semibold shadow-sm">Şehrim</a></li>
                        <li><a href="Mirasımız.html" class="custom-link d-block p-3 rounded text-center fw-semibold shadow-sm">Mirasımız</a></li>
                        <li><a href="İlgi-Alanlarım.html" class="custom-link d-block p-3 rounded text-center fw-semibold shadow-sm">İlgi Alanlarım</a></li>
                        <li><a href="İletişim.html" class="custom-link d-block p-3 rounded text-center fw-semibold shadow-sm">İletişim</a></li>
                    </ul>
                    
                </div>
            </div>
        </nav>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
